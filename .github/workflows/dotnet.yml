# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore senac-qualidade-e-teste-de-software-main/dotnet/SeleniumDev/Senac.QTS.SeleniumDev.Test/Senac.QTS.SeleniumDev.Test.csproj

    - name: Build
      run: dotnet build senac-qualidade-e-teste-de-software-main/dotnet/SeleniumDev/Senac.QTS.SeleniumDev.Test/Senac.QTS.SeleniumDev.Test.csproj --no-restore

    - name: Test
      run: dotnet test senac-qualidade-e-teste-de-software-main/dotnet/SeleniumDev/Senac.QTS.SeleniumDev.Test/Senac.QTS.SeleniumDev.Test.csproj --no-build --verbosity normal
